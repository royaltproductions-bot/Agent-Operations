name: Cyclops approved encrypted export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cyclops-approved-export.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Export only the approved PDF with recipient encryption
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          CYCLOPS_ASSET_KEY: ${{ secrets.CYCLOPS_ASSET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from tools import cyclops_vault
          files=cyclops_vault.read_asset_files("e46509dbb213a33c25fd")
          manifest=json.loads(Path("products/cyclops/e46509dbb213a33c25fd/manifest.json").read_text())
          assert len(files)==1 and hashlib.sha256(files[0][1]).hexdigest()==manifest["artifact_manifest"][0]["sha256"]
          plain=json.dumps({"asset_id":"e46509dbb213a33c25fd","files":[{"name":n,"base64":base64.b64encode(b).decode()} for n,b in files]}).encode()
          key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          pub=serialization.load_pem_public_key('-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuqwca45BRzxMYUfKKJ1B\nzT2k+GTmrY7KBDSBJw/3/GZeU2gMz8v3g/FAX0qYHHAc2Hq4nhJWO1BRmRnHy4L1\n4lcomNWVLeE97aJsUEd4K+kl7nD4600fFelpaG5pAx4yhOEnd7dYJbTR9GEYXFv0\ntxUI76WEKPqfDSxnIF9ZjXqeB1ThhKVAA6QDFg0QKQ0m/wl5hIetWVCQRNZOrzB+\nbrL7o0OTzXiqwhtOeGcyAsGKaL2FeOHgV5pNxIMoR5LDxKylO/0J8JQxtgE64Ee4\nUBYeDGnWVyaCCMctkw0nHXSCeSQ4XoWB7uLc67jIclEM52pnxUbQfjMDKsDdjk1C\niE6MeVo9xj3WY0hdCVPk2oce/S438gWlVZmdD6On65PX/aLZ0e1XKW568bCbIEyO\nfG/qJ2wuRG6u9/JQFK67d6K2IgHd4bDiVqLwSkvouEszldWackc5yZQoR4phxHzl\nINK2N0FBQ7/1eVTLKO6w4B5AZBrXZZ1Hlb4sjst9v+2BAgMBAAE=\n-----END PUBLIC KEY-----\n'.encode())
          wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          record={"asset_id":"e46509dbb213a33c25fd","run_id":os.environ["GITHUB_RUN_ID"],"encrypted_key":base64.b64encode(wrapped).decode(),"nonce":base64.b64encode(nonce).decode(),"ciphertext":base64.b64encode(AESGCM(key).encrypt(nonce,plain,b"cyclops-export-v1")).decode()}
          Path("ops/cyclops-export-20261111.json").write_text(json.dumps(record)+"\n")
          print("Approved asset integrity verified; encrypted export ready")
          PY
      - name: Persist encrypted delivery envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.persist_run_receipt ops/cyclops-export-20261111.json 'Export approved Cyclops asset encrypted for marketplace setup'
