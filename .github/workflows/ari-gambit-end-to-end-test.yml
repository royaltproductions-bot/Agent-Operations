name: ARI Gambit buyer-message full-path checks
on:
  push:
    branches: ['test/gambit-buyer-message-end-to-end-20261101']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install offline test requirements
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow
      - name: Run Gambit regression suite
        run: |
          python3 -m py_compile tools/gambit_worker.py tools/gambit_early_scan.py tests/test_gambit_worker.py
          python3 -m unittest discover -s tests -p 'test_gambit_worker.py' -q
