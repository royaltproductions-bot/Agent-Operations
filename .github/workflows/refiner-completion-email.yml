name: Refiner Completion Email
on:
  workflow_run:
    workflows: ["Continuous Autonomous Commerce Refiner"]
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      REFINER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      REFINER_RUN_ID: ${{ github.event.workflow_run.id }}
      REFINER_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Send completion email
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTMAIL_API_KEY"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          owner=os.environ["GITHUB_REPOSITORY"].split("/",1)[0]
          req=urllib.request.Request(
              "https://api.github.com/users/"+urllib.parse.quote(owner,safe=""),
              headers={"Accept":"application/vnd.github+json","User-Agent":"commerce-refiner-notifier/1.0"})
          with urllib.request.urlopen(req,timeout=20) as response:
              email=json.load(response).get("email")
          if not email:
              raise SystemExit("repository owner has no public notification email")

          conclusion=os.environ.get("REFINER_CONCLUSION","unknown")
          run_id=os.environ.get("REFINER_RUN_ID","")
          run_url=os.environ.get("REFINER_RUN_URL","")
          subject=f"Autonomous Commerce Refiner: {conclusion.upper()}"
          body=(
              "The Continuous Autonomous Commerce Refiner finished.\n\n"
              f"Conclusion: {conclusion}\n"
              f"Run ID: {run_id}\n"
              f"Run: {run_url}\n"
          )
          payload=json.dumps({"to":[email],"subject":subject,"text":body}).encode()
          inbox="ari-operations@agentmail.to"
          send=urllib.request.Request(
              "https://api.agentmail.to/v0/inboxes/"+urllib.parse.quote(inbox,safe="")+"/messages/send",
              data=payload,method="POST",
              headers={"Authorization":"Bearer "+os.environ["AGENTMAIL_API_KEY"],
                       "Content-Type":"application/json","Accept":"application/json",
                       "User-Agent":"commerce-refiner-notifier/1.0",
                       "Idempotency-Key":"refiner-completion-"+run_id})
          with urllib.request.urlopen(send,timeout=25) as response:
              result=json.load(response)
          if not result.get("message_id"):
              raise SystemExit("AgentMail did not confirm completion email")
          print("refiner completion email sent")
          PY
