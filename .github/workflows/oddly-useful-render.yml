name: Oddly Useful Stuff - Render Creative PNG
on:
  push:
    branches: [main]
    paths:
      - 'campaigns/oddly-useful-stuff/creative-source/*.svg'
      - '.github/workflows/oddly-useful-render.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oddly-useful-render-main
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Install SVG renderer
        run: python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'CairoSVG==2.8.2' 'imageio-ffmpeg==0.6.0'
      - name: Render SVG source to public PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import cairosvg
          import imageio_ffmpeg
          root = Path('campaigns/oddly-useful-stuff')
          source = root / 'creative-source'
          destination = root / 'media'
          destination.mkdir(parents=True, exist_ok=True)
          existing_mp4 = {p.name for p in destination.glob('*.mp4')}
          sources = sorted(source.glob('*.svg'))
          if not sources:
              raise RuntimeError('No SVG sources found.')
          for src in sources:
              if src.stat().st_size > 150_000:
                  raise RuntimeError('SVG source too large: ' + src.name)
              output = destination / (src.stem + '.png')
              if output.exists():
                  continue
              cairosvg.svg2png(url=str(src), write_to=str(output), output_width=1080, output_height=1920)
              if output.stat().st_size < 1000:
                  raise RuntimeError('Generated image unexpectedly small: ' + output.name)
              print('RENDERED:', output, output.stat().st_size, 'bytes')
          # TikTok's automatic Buffer path is video-first. Render an actual
          # short MP4 from each reviewed card without pretending PNG drafts are live posts.
          for png in sorted(destination.glob('*.png')):
              video = png.with_suffix('.mp4')
              if video.exists():
                  continue
              subprocess.run([
                  imageio_ffmpeg.get_ffmpeg_exe(), '-hide_banner', '-loglevel', 'error', '-y',
                  '-loop', '1', '-framerate', '24', '-i', str(png),
                  '-f', 'lavfi', '-i', 'anullsrc=channel_layout=stereo:sample_rate=44100',
                  '-t', '6', '-vf',
                  'scale=720:1280:flags=lanczos,format=yuv420p,fade=t=in:st=0:d=0.4,fade=t=out:st=5.6:d=0.4',
                  '-r', '24', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '25',
                  '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '64k',
                  '-shortest', '-movflags', '+faststart', str(video)
              ], check=True, timeout=150)
              if video.stat().st_size < 1000:
                  raise RuntimeError('Generated MP4 unexpectedly small: ' + video.name)
              print('VIDEO:', video, video.stat().st_size, 'bytes')
          new_video_files = sorted(str(p) for p in destination.glob('*.mp4') if p.name not in existing_mp4)
          Path('/tmp/oddly-new-videos.txt').write_text('\\n'.join(new_video_files) + ('\\n' if new_video_files else ''), encoding='utf-8')
          print('NEW_RENDERED_VIDEOS:', new_video_files)
          PY
      - name: Prepare eligible AI experiment documentary posts
        run: python3 tools/oddly_auto_publish.py
      - name: Commit public PNG, MP4 and new post manifests
        shell: bash
        run: |
          set -euo pipefail
          git add campaigns/oddly-useful-stuff/media/*.png campaigns/oddly-useful-stuff/media/*.mp4 campaigns/oddly-useful-stuff/posts/*.json
          if git diff --cached --quiet; then
            echo 'No new media to commit.'
          else
            git -c user.name='oddly-useful-bot' -c user.email='ari-operations@agentmail.to' commit -m 'Render free promotional PNG assets for Oddly Useful Stuff'
            git push
          fi

      - name: Submit newly rendered opted-in episodes to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/oddly-ready-posts.txt ]; then
            echo 'No eligible new documentary episode; skipping Buffer.'
            exit 0
          fi
          test -f campaigns/oddly-useful-stuff/.enable-live-publishing || { echo 'Live gate disabled'; exit 1; }
          test -n "$BUFFER_API_KEY" || { echo 'Missing Buffer key'; exit 1; }
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            BUFFER_QUEUE_ENABLED=YES python3 tools/buffer_publisher.py --mode queue --input "$file"
          done < /tmp/oddly-ready-posts.txt
