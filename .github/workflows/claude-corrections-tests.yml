name: Claude correction regression tests
# Current-main verification marker.
on:
  pull_request:
    paths: ['tools/**', 'tests/**', '.github/workflows/claude-corrections-tests.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography pypdf python-docx python-pptx openpyxl reportlab pillow
      - run: python -m unittest tests.test_gambit_browser_metrics tests.test_claude_corrections tests.test_gambit_worker tests.test_gambit_watch tests.test_gambit_openai tests.test_gambit_commercial tests.test_gambit_secondary_marketplace tests.test_gambit_artifacts tests.test_gambit_agent_card tests.test_x_variant_execution tests.test_firsthand_source_recovery tests.test_variant_optimization
