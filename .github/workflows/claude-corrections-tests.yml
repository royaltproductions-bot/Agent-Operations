name: Claude correction regression tests
on:
  pull_request:
    paths: ['tools/**', 'tests/**', '.github/workflows/claude-corrections-tests.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography pypdf python-docx python-pptx openpyxl reportlab pillow
      - run: command -v ffmpeg && command -v ffprobe && ffmpeg -hide_banner -filters | grep -w flite || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: python -m unittest tests.test_gambit_hired_delivery tests.test_gambit_browser_metrics tests.test_claude_corrections tests.test_gambit_worker tests.test_gambit_operator_actions tests.test_gambit_watch tests.test_gambit_early_scan tests.test_gambit_openai tests.test_gambit_commercial tests.test_gambit_github_bounties tests.test_gambit_secondary_marketplace tests.test_gambit_artifacts tests.test_gambit_agent_card tests.test_cyclops_run_budget tests.test_wolverine_rfp_channel tests.test_x_variant_execution tests.test_firsthand_source_recovery tests.test_variant_optimization

        env:
          GAMBIT_TEST_ARTIFACT_DIR: gambit-test-artifacts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gambit-offline-hired-delivery-proof
          path: gambit-test-artifacts/
          if-no-files-found: error
          retention-days: 3
