name: Cyclops targeted regression for price parser
on:
  push:
    branches: ['fix/cyclops-price-parsing-20261101']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            cryptography pypdf beautifulsoup4 jinja2 \
            'openpyxl>=3.1,<4' 'reportlab>=4,<5' pillow
      - name: Syntax and existing X-Variant tests
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
