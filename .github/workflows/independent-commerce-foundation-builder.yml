name: Continuous Autonomous Commerce Refiner
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: independent-commerce-foundation-builder
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install local inference runtime
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen3:4b-instruct-2507-q4_K_M
      - name: Develop and validate candidate
        run: python3 tools/independent_development_worker.py
      - name: Integrate validated refinement into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No validated code change."
            exit 0
          fi
          git add tools/connected_commerce_tools.py tools/autonomous_commerce_brain.py tools/commerce_operator.py tools/dynamic_offer_catalog.py tools/digital_artifact_factory.py tools/commerce_distribution.py tools/general_order_fulfillment.py
          git -c user.name="commerce-refiner-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refine autonomous commerce execution from operational evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            sleep 2
          done
          exit 1
