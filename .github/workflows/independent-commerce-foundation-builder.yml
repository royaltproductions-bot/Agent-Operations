name: Continuous Autonomous Commerce Refiner
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-commerce-foundation-builder.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: independent-commerce-foundation-builder
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install local inference runtime
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen3:4b-instruct-2507-q4_K_M
      - name: Observe, diagnose, implement and validate refinement
        run: python3 tools/continuous_commerce_refiner.py
      - name: Integrate validated refinement into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- tools tests products storefront ventures ops/refiner-runs)" ]; then
            echo "No validated code change."
            exit 0
          fi
          git add tools tests products storefront ventures ops/refiner-runs
          git -c user.name="commerce-refiner-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refine autonomous commerce execution from operational evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            python3 -m compileall -q tools tests
            python3 -m unittest discover -s tests -v
            python3 tools/connected_commerce_tools.py >/dev/null
            sleep 2
          done
          exit 1
      - name: Verify integrated refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v
          python3 tools/connected_commerce_tools.py >/tmp/commerce-refiner-smoke.json
          python3 - <<'PY'
          import json
          row=json.load(open('/tmp/commerce-refiner-smoke.json'))
          assert isinstance(row,dict) and 'capabilities' in row and 'assets' in row
          print('integrated commerce smoke verified')
          PY
