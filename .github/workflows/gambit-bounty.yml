name: Gambit Paid Bounties

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use watch for the free continuous polling chain'
        required: false
        default: once
        type: string
  push:
    branches: [main]
    paths:
      - 'tools/gambit_worker.py'
      - 'tools/gambit_research.py'
      - 'tools/gambit_documents.py'
      - 'tools/gambit_artifacts.py'
      - 'tools/gambit_visual_qa.py'
      - 'tools/gambit_web_design.py'
      - 'tools/gambit_site_resources.py'
      - 'tools/gambit_resources.py'
      - 'tools/gambit_plugin_*.py'
      - 'tools/gambit_site_smoke.py'
      - 'assets/website_builder/**'
      - 'tools/gambit_analytics.py'
      - 'tests/test_gambit_worker.py'
      - 'tests/test_gambit_research.py'
      - 'tests/test_gambit_documents.py'
      - 'tests/test_gambit_artifacts.py'
      - 'tests/test_gambit_visual_qa.py'
      - 'tests/test_gambit_web_design.py'
      - 'tests/test_gambit_site_resources.py'
      - 'tests/test_gambit_resources.py'
      - 'tests/test_gambit_analytics.py'
      - '.github/workflows/gambit-bounty.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gambit-bounty-worker
  # Code hotfixes replace stale polling workers; routine polls never interrupt.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  find-and-fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      V0_API_KEY: ${{ secrets.V0_API_KEY }}
      GAMBIT_WEBSITE_BUILDER: '1'
      GAMBIT_MODEL: qwen3:8b
      GAMBIT_TRIAGE_MODEL: qwen3:1.7b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      GAMBIT_WATCH_MODE: ${{ inputs.mode || 'once' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: main  # Load the latest persisted state after a queued predecessor finishes.
          persist-credentials: true

      - name: Install and validate free artifact generation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48'

      - name: Validate worker code
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q

      - name: Inspect real desktop and mobile website layout on source changes
        if: github.event_name == 'push'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet playwright pillow
          python3 -m tools.gambit_site_smoke

      - name: Save website screenshot evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gambit-responsive-website-preview
          path: ${{ runner.temp }}/gambit-website-preview
          retention-days: 7

      - name: Cache small fast-decision model for the watch
        if: github.event_name == 'push' || github.event_name == 'schedule' || env.GAMBIT_WATCH_MODE == 'watch'
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-qwen3-triage-1-7b-v1

      - name: Launch model warmup in background while market polling starts
        if: github.event_name == 'push' || github.event_name == 'schedule' || env.GAMBIT_WATCH_MODE == 'watch'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOUNTY_AGENT_API_KEY:-}" ]; then
            exit 0
          fi
          # This process warms Ollama independently. The next step begins
          # querying TryBounty immediately, rather than losing ~2 minutes
          # installing Ollama before the first marketplace observation.
          cat > "${RUNNER_TEMP}/gambit-warm.sh" <<'WARM'
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve >/tmp/gambit-ollama.log 2>&1 < /dev/null &
          fi
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! ollama show "$GAMBIT_TRIAGE_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_TRIAGE_MODEL"
          fi
          curl -fsS http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$GAMBIT_TRIAGE_MODEL\",\"prompt\":\"ready\",\"stream\":false,\"keep_alive\":\"60m\",\"options\":{\"num_predict\":1}}" \
            >/dev/null
          touch "$RUNNER_TEMP/gambit-fast-model-ready"
          WARM
          nohup bash "${RUNNER_TEMP}/gambit-warm.sh" \
            >/tmp/gambit-model-warmup.log 2>&1 < /dev/null &
          echo "Warmup started asynchronously; marketplace polling will not wait."

      - name: Check authorized live market for work
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOUNTY_AGENT_API_KEY:-}" ]; then
            echo 'Gambit not connected yet: API key missing from GitHub Secrets.'
            echo 'connected=false' >> "$GITHUB_OUTPUT"
            echo 'needs_model=false' >> "$GITHUB_OUTPUT"
            echo 'needs_production_model=false' >> "$GITHUB_OUTPUT"
            echo 'needs_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'connected=true' >> "$GITHUB_OUTPUT"
          # Normal manual/push jobs probe once and hand off to a watch job.
          # Scheduled and self-dispatched watch jobs poll every 30 seconds.
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] && [ "${GAMBIT_WATCH_MODE}" != "watch" ]; then
            python3 -m tools.gambit_worker --probe
            exit 0
          fi

          # Bounded runtime plus an explicit successor avoids dependence on
          # GitHub's frequently delayed cron launches. The 5-minute schedule
          # remains a recovery trigger if an earlier worker dies.
          poll_report="${RUNNER_TEMP}/gambit-poll-output"
          for iteration in $(seq 1 100); do
            started=${SECONDS}
            : > "$poll_report"
            GITHUB_OUTPUT="$poll_report" python3 -m tools.gambit_worker --probe
            if grep -Eq '^needs_(model|run)=true$' "$poll_report"; then
              echo "Actionable Bounty state found after poll ${iteration}; continuing."
              break
            fi
            if [ "$iteration" -ge 100 ]; then
              break
            fi
            elapsed=$((SECONDS - started))
            delay=$((30 - elapsed))
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
          done
          cat "$poll_report" >> "$GITHUB_OUTPUT"

      - name: Benchmark and check fast commercial decisions on a synthetic bounty
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import time
          from tools import gambit_worker as worker

          example = {"bounty": {
              "title": "Summarize the supplied product memo",
              "description": "Memo: The Orion lamp has two brightness settings, "
                             "USB-C charging, and a two-year warranty. Write "
                             "a factual five-sentence summary of this memo.",
              "verification": "Deliver a five-sentence summary faithful to the memo.",
              "status": "open", "flow": "bid", "budget_cents": 2500,
              "currency": "usd", "version": 1}}
          started = time.monotonic()
          decision = worker.assess(example)
          elapsed = round(time.monotonic() - started, 2)
          print(json.dumps({"synthetic_full_triage_seconds": elapsed,
                            "target_seconds": 60,
                            "within_target": elapsed < 60,
                            "decision": decision.get("decision"),
                            "audit_disagreement": bool(decision.get("_audit_disagreement")),
                            "correctly_considered_feasible": decision.get("decision") == "bid"}))
          assert decision.get("decision") == "bid", "feasible_bounty_rejected_by_triage"
          PY

      - name: Preserve discovered bounty IDs and encrypted briefs before model startup
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Checkpoint Gambit bounty discoveries before inference'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not checkpoint discovered bounties before model startup' >&2
          exit 1

      - name: Cache fast-decision model for a non-watch evaluation
        if: steps.probe.outputs.needs_model == 'true' && github.event_name != 'schedule' && env.GAMBIT_WATCH_MODE != 'watch'
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-qwen3-triage-1-7b-v1

      - name: Enable free public web search when research work appears
        if: steps.probe.outputs.needs_model == 'true'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check --quiet ddgs==9.16.1

      - name: Enable browser-based website delivery checks only when work appears
        if: steps.probe.outputs.needs_model == 'true'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check --quiet playwright pillow

      - name: Start model only when work appears
        if: steps.probe.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # If a watcher found work during background warmup, wait for that
          # process instead of launching two competing installers or downloads.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || \
             [ "${GAMBIT_WATCH_MODE}" = "watch" ] || \
             [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            for attempt in $(seq 1 150); do
              if [ -f "${RUNNER_TEMP}/gambit-fast-model-ready" ]; then
                break
              fi
              sleep 2
            done
          fi
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            sudo systemctl stop ollama.service 2>/dev/null || true
            mkdir -p "$OLLAMA_MODELS"
            nohup ollama serve >/tmp/gambit-ollama.log 2>&1 &
          fi
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! ollama show "$GAMBIT_TRIAGE_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_TRIAGE_MODEL"
          fi
          # The larger model is reserved for work already hired and paid for.
          if [ "${{ steps.probe.outputs.needs_production_model }}" = "true" ] && \
             ! ollama show "$GAMBIT_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_MODEL"
          fi

      - name: Evaluate, bid, and finish hired work
        if: steps.probe.outputs.needs_run == 'true'
        run: python3 -m tools.gambit_worker

      - name: Save idempotency state and verified outcome receipts
        if: always() && steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/gambit/state.json ]; then
            exit 0
          fi
          # Rebase of the state commit needs its own identity too. The previous
          # workflow configured identity only on `git commit`, then failed when
          # a concurrent code push forced `git rebase origin/main`.
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Gambit commissioned-work outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not persist Gambit state after three fast-forward retries' >&2
          exit 1

      - name: Continue the free Gambit watch chain
        if: (success() || failure()) && steps.probe.outputs.connected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAMBIT_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          # Errors must not strand the agent; a short delay avoids failure storms.
          if [ "$GAMBIT_PRIOR_JOB_STATUS" != 'success' ]; then
            sleep 120
          fi
          gh workflow run gambit-bounty.yml --ref main -f mode=watch
