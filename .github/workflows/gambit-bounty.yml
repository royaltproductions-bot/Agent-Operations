name: Gambit Paid Bounties

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use watch for the free continuous polling chain'
        required: false
        default: once
        type: string
  push:
    branches: [main]
    paths:
      - 'tools/gambit_worker.py'
      - 'tools/gambit_research.py'
      - 'tools/gambit_documents.py'
      - 'tools/gambit_artifacts.py'
      - 'tools/gambit_analytics.py'
      - 'tests/test_gambit_worker.py'
      - 'tests/test_gambit_research.py'
      - 'tests/test_gambit_documents.py'
      - 'tests/test_gambit_artifacts.py'
      - 'tests/test_gambit_analytics.py'
      - '.github/workflows/gambit-bounty.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gambit-bounty-worker
  # Code hotfixes replace stale polling workers; routine polls never interrupt.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  find-and-fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      GAMBIT_MODEL: qwen3:8b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      GAMBIT_WATCH_MODE: ${{ inputs.mode || 'once' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: main  # Load the latest persisted state after a queued predecessor finishes.
          persist-credentials: true

      - name: Install and validate free artifact generation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' 'reportlab>=4,<5'

      - name: Validate worker code
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q

      - name: Check authorized live market for work
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOUNTY_AGENT_API_KEY:-}" ]; then
            echo 'Gambit not connected yet: API key missing from GitHub Secrets.'
            echo 'connected=false' >> "$GITHUB_OUTPUT"
            echo 'needs_model=false' >> "$GITHUB_OUTPUT"
            echo 'needs_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'connected=true' >> "$GITHUB_OUTPUT"
          # Normal manual/push jobs probe once and hand off to a watch job.
          # Scheduled and self-dispatched watch jobs poll every 30 seconds.
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] && [ "${GAMBIT_WATCH_MODE}" != "watch" ]; then
            python3 -m tools.gambit_worker --probe
            exit 0
          fi

          # Bounded runtime plus an explicit successor avoids dependence on
          # GitHub's frequently delayed cron launches. The 5-minute schedule
          # remains a recovery trigger if an earlier worker dies.
          poll_report="${RUNNER_TEMP}/gambit-poll-output"
          for iteration in $(seq 1 100); do
            started=${SECONDS}
            : > "$poll_report"
            GITHUB_OUTPUT="$poll_report" python3 -m tools.gambit_worker --probe
            if grep -Eq '^needs_(model|run)=true$' "$poll_report"; then
              echo "Actionable Bounty state found after poll ${iteration}; continuing."
              break
            fi
            if [ "$iteration" -ge 100 ]; then
              break
            fi
            elapsed=$((SECONDS - started))
            delay=$((30 - elapsed))
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
          done
          cat "$poll_report" >> "$GITHUB_OUTPUT"

      - name: Cache open-source model
        if: steps.probe.outputs.needs_model == 'true'
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-qwen3-8b-v1

      - name: Enable free public web search when research work appears
        if: steps.probe.outputs.needs_model == 'true'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check --quiet ddgs==9.16.1

      - name: Start model only when work appears
        if: steps.probe.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/gambit-ollama.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! ollama show "$GAMBIT_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_MODEL"
          fi

      - name: Evaluate, bid, and finish hired work
        if: steps.probe.outputs.needs_run == 'true'
        run: python3 -m tools.gambit_worker

      - name: Save idempotency state and verified outcome receipts
        if: always() && steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/gambit/state.json ]; then
            exit 0
          fi
          # Rebase of the state commit needs its own identity too. The previous
          # workflow configured identity only on `git commit`, then failed when
          # a concurrent code push forced `git rebase origin/main`.
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Gambit commissioned-work outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not persist Gambit state after three fast-forward retries' >&2
          exit 1

      - name: Continue the free Gambit watch chain
        if: (success() || failure()) && steps.probe.outputs.connected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAMBIT_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          # Errors must not strand the agent; a short delay avoids failure storms.
          if [ "$GAMBIT_PRIOR_JOB_STATUS" != 'success' ]; then
            sleep 120
          fi
          gh workflow run gambit-bounty.yml --ref main -f mode=watch
