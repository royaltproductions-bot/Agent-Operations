name: Gambit Paid Bounties

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/gambit_worker.py'
      - 'tools/gambit_early_scan.py'
      - 'tests/test_gambit_early_scan.py'
      - 'tools/gambit_research.py'
      - 'tools/gambit_documents.py'
      - 'tools/gambit_artifacts.py'
      - 'tools/gambit_visual_qa.py'
      - 'tools/gambit_web_design.py'
      - 'tools/gambit_site_resources.py'
      - 'tools/gambit_resources.py'
      - 'tools/gambit_plugin_*.py'
      - 'tools/gambit_site_smoke.py'
      - 'assets/website_builder/**'
      - 'tools/gambit_analytics.py'
      - 'tests/test_gambit_worker.py'
      - 'tests/test_gambit_research.py'
      - 'tests/test_gambit_documents.py'
      - 'tests/test_gambit_artifacts.py'
      - 'tests/test_gambit_visual_qa.py'
      - 'tests/test_gambit_web_design.py'
      - 'tests/test_gambit_site_resources.py'
      - 'tests/test_gambit_resources.py'
      - 'tests/test_gambit_analytics.py'
      - '.github/workflows/gambit-bounty.yml'

permissions:
  contents: write

concurrency:
  group: gambit-bounty-worker
  # Keep an accepted bounty running through unrelated code pushes or scheduled checks.
  cancel-in-progress: false

jobs:
  find-and-fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      V0_API_KEY: ${{ secrets.V0_API_KEY }}
      GAMBIT_WEBSITE_BUILDER: '1'
      GAMBIT_MODEL: qwen3:8b
      GAMBIT_TRIAGE_MODEL: qwen3:1.7b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: main  # Load the latest persisted state after a queued predecessor finishes.
          persist-credentials: true

      - name: Watch TryBounty every 30 seconds without AI
        id: market
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != 'schedule' ]; then
            python3 -m tools.gambit_early_scan --probe
            exit 0
          fi
          successful=0
          for iteration in $(seq 1 20); do
            started=$SECONDS
            if python3 -m tools.gambit_early_scan --probe; then
              successful=1
              if grep -q 'needs_run=true' "$GITHUB_OUTPUT"; then
                echo "Marketplace work detected on scan $iteration"
                break
              fi
            else
              echo 'Temporary TryBounty check failed; retrying' >&2
            fi
            if [ "$iteration" -lt 20 ]; then
              elapsed=$((SECONDS - started))
              delay=$((30 - elapsed))
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            fi
          done
          if [ "$successful" -eq 0 ]; then
            echo 'TryBounty unavailable throughout watch window' >&2
            exit 1
          fi
      - name: Preserve discovered IDs immediately
        if: always() && steps.market.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ops/gambit/state.json; then
            exit 0
          fi
          # Persist newly seen IDs immediately, so a short-lived listing can
          # still be recovered by its ID even when it closes during warmup.
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          git commit -m 'Remember new Gambit market opportunities immediately'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Early bounty checkpoint did not reach GitHub' >&2
          exit 1

      - name: Install and validate free artifact generation dependencies
        if: steps.market.outputs.needs_run == 'true' || github.event_name == 'push'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48'

      - name: Validate worker code
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q

      - name: Confirm current job state and preserve encrypted details
        id: probe
        if: steps.market.outputs.needs_run == 'true'
        run: python3 -m tools.gambit_worker --probe

      - name: Preserve discovered bounty IDs and encrypted briefs before model startup
        if: steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Checkpoint Gambit bounty discoveries before inference'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not checkpoint discovered bounties before model startup' >&2
          exit 1

      - name: Cache fast-decision model for a non-watch evaluation
        if: steps.probe.outputs.needs_model == 'true'
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-qwen3-triage-1-7b-v1

      - name: Enable free public web search when research work appears
        if: steps.probe.outputs.needs_model == 'true'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check --quiet ddgs==9.16.1

      - name: Enable browser-based website delivery checks only when work appears
        if: steps.probe.outputs.needs_model == 'true'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check --quiet playwright pillow

      - name: Start model only when work appears
        if: steps.probe.outputs.needs_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            sudo systemctl stop ollama.service 2>/dev/null || true
            mkdir -p "$OLLAMA_MODELS"
            nohup ollama serve >/tmp/gambit-ollama.log 2>&1 &
          fi
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! ollama show "$GAMBIT_TRIAGE_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_TRIAGE_MODEL"
          fi
          # The larger model is reserved for work already hired and paid for.
          if [ "${{ steps.probe.outputs.needs_production_model }}" = "true" ] && \
             ! ollama show "$GAMBIT_MODEL" >/dev/null 2>&1; then
            ollama pull "$GAMBIT_MODEL"
          fi

      - name: Evaluate, bid, and finish hired work
        if: steps.probe.outputs.needs_run == 'true'
        run: python3 -m tools.gambit_worker

      - name: Save idempotency state and verified outcome receipts
        if: always() && steps.probe.outputs.needs_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/gambit/state.json ]; then
            exit 0
          fi
          # Rebase of the state commit needs its own identity too. The previous
          # workflow configured identity only on `git commit`, then failed when
          # a concurrent code push forced `git rebase origin/main`.
          git config user.name 'gambit-worker'
          git config user.email 'ari-operations@agentmail.to'
          git add ops/gambit/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Gambit commissioned-work outcomes'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not persist Gambit state after three fast-forward retries' >&2
          exit 1

 "$GITHUB_OUTPUT"; then
                echo "Marketplace work detected on scan $iteration"
                break
              fi
            else
              echo "TryBounty check failed; retrying on next interval" >&2
            fi
            if [ "$iteration" -lt 20 ]; then
              elapsed=$((SECONDS - started))
              delay=$((30 - elapsed))
