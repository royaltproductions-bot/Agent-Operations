name: Gambit Paid Bounties

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/gambit_worker.py'
      - 'tools/gambit_openai.py'
      - 'tests/test_gambit_openai.py'
      - 'tools/gambit_watch.py'
      - 'tools/gambit_models.sh'
      - 'tests/test_gambit_watch.py'
      - 'tools/gambit_early_scan.py'
      - 'tests/test_gambit_early_scan.py'
      - 'tools/gambit_research.py'
      - 'tools/gambit_documents.py'
      - 'tools/gambit_artifacts.py'
      - 'tools/gambit_visual_qa.py'
      - 'tools/gambit_site_resources.py'
      - 'tools/gambit_resources.py'
      - 'tools/gambit_plugin_*.py'
      - 'tools/gambit_site_smoke.py'
      - 'assets/website_builder/**'
      - 'tools/gambit_analytics.py'
      - 'tests/test_gambit_worker.py'
      - 'tests/test_gambit_operations.py'
      - 'tests/test_gambit_research.py'
      - 'tests/test_gambit_documents.py'
      - 'tests/test_gambit_artifacts.py'
      - 'tests/test_gambit_visual_qa.py'
      - 'tests/test_gambit_site_resources.py'
      - 'tests/test_gambit_resources.py'
      - 'tests/test_gambit_analytics.py'
      - '.github/workflows/gambit-bounty.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gambit-bounty-worker
  # Keep an accepted bounty running through unrelated code pushes or scheduled checks.
  cancel-in-progress: false

jobs:
  find-and-fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Free local model until a dedicated OpenAI API key is explicitly
      # configured as a repository secret; never spend by default.
      GAMBIT_INFERENCE_PROVIDER: auto
      GAMBIT_OPENAI_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_TRIAGE_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_DECISION_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_WRITING_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_REASONING_EFFORT: medium
      GAMBIT_OPENAI_MONTHLY_LIMIT_USD: '20.00'
      GAMBIT_OPENAI_MAX_ESTIMATED_CALL_USD: '0.08'
      GAMBIT_WEBSITE_BUILDER: '1'
      GAMBIT_MODEL: qwen3:8b
      GAMBIT_TRIAGE_MODEL: qwen3:1.7b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: main  # Load the latest persisted state after a queued predecessor finishes.
          persist-credentials: true

      - name: Install runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow

      - name: Validate worker code
        id: validation
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q

      - name: Restore reusable models
        if: env.OPENAI_API_KEY == ''
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-resident-models-v1
          restore-keys: |
            gambit-qwen3-production-8b-triage-1-7b-v2
            gambit-qwen3-triage-1-7b-v1

      - name: Verify live public search on code changes
        continue-on-error: true
        if: github.event_name == 'push'
        run: python3 -m tools.gambit_research --smoke

      - name: Watch, process, checkpoint, and resume watching
        run: python3 -u -m tools.gambit_watch

      - name: Hand off directly to the next runner
        if: always() && !cancelled() && steps.validation.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dispatch is immediate; cron remains a fallback if handoff fails.
          for attempt in 1 2 3; do
            if gh workflow run gambit-bounty.yml --ref main; then exit 0; fi
            sleep 5
          done
          exit 1
