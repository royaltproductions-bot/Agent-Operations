name: Gambit Paid Bounties

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: gambit-bounty-worker
  # Keep an accepted bounty running through unrelated code pushes or scheduled checks.
  cancel-in-progress: false

jobs:
  find-and-fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Free marketplace polling continues without a key; never let the old
      # local model submit new bids after switching Gambit to GPT-6.1 Sol.
      GAMBIT_INFERENCE_PROVIDER: openai
      GAMBIT_OPENAI_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_TRIAGE_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_DECISION_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_WRITING_MODEL: gpt-6.1-sol
      GAMBIT_OPENAI_REASONING_EFFORT: medium
      GAMBIT_OPENAI_MONTHLY_LIMIT_USD: '20.00'
      GAMBIT_OPENAI_MAX_ESTIMATED_CALL_USD: '0.08'
      GAMBIT_WEBSITE_BUILDER: '1'
      GAMBIT_APP_BUILDER: '1'
      GAMBIT_INCREMENTAL_RESEARCH: '1'
      GAMBIT_MODEL: qwen3:8b
      GAMBIT_TRIAGE_MODEL: qwen3:1.7b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: main  # Load the latest persisted state after a queued predecessor finishes.
          persist-credentials: true

      - name: Restore isolated Gambit state and monthly budget
        run: |
          set -euo pipefail
          git fetch --no-tags origin gambit-state
          git show origin/gambit-state:ops/gambit/state.json > ops/gambit/state.json
          git show origin/gambit-state:ops/gambit/openai_budget.json > ops/gambit/openai_budget.json

      - name: Install runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow

      - name: Read browser-only dashboard metrics once per run
        continue-on-error: true
        env:
          GAMBIT_BROWSER_STORAGE_STATE: ${{ secrets.GAMBIT_BROWSER_STORAGE_STATE }}
        run: |
          if [ -n "$GAMBIT_BROWSER_STORAGE_STATE" ]; then
            python3 -m playwright install --with-deps chromium || true
          fi
          python3 -m tools.gambit_browser_metrics

      - name: Restore reusable models
        if: env.OPENAI_API_KEY == ''
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-resident-models-v1
          restore-keys: |
            gambit-qwen3-production-8b-triage-1-7b-v2
            gambit-qwen3-triage-1-7b-v1

      - name: Check marketplace, process work, and checkpoint
        env:
          GAMBIT_WATCH_SECONDS: '240'
        run: python3 -u -m tools.gambit_watch
