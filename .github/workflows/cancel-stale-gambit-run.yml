name: Cancel Stale Gambit Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-gambit-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pre-recovery resident run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/43103123585/cancel
