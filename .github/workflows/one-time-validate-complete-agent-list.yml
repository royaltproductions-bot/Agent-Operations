name: Validate full X-variant corrections offline
# Final bid-scope update: test 50/500 prospect feasibility guards
# Final rerun after research-memory lane initialization fix
on:
  push:
    paths: ['.github/workflows/one-time-validate-complete-agent-list.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install unit-test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow playwright
      - name: Validate logic and all regression tests
        run: |
          python3 -m compileall -q tools
          python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
      - name: Validate isolated Gambit state and Sol-only workflow wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          flow=Path('.github/workflows/gambit-bounty.yml').read_text()
          watch=Path('tools/gambit_watch.py').read_text()
          assert 'origin/gambit-state:ops/gambit/state.json' in flow
          assert 'origin/gambit-state:ops/gambit/openai_budget.json' in flow
          assert 'HEAD:refs/heads/gambit-state' in watch
          assert 'HEAD:main' not in watch
          assert "GAMBIT_OPENAI_MONTHLY_LIMIT_USD: '20.00'" in flow
          print('Isolated state and budget controls wired')
          PY