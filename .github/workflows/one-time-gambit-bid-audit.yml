name: Read-only Gambit eight-bid capability audit
# Final read after unsupported-offer reconciliation
on:
  push:
    paths: ['.github/workflows/one-time-gambit-bid-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet 'cryptography>=43,<48' 'python-docx>=1.2,<2' 'pypdf>=5,<8' 'openpyxl>=3.1,<4' 'reportlab>=4,<5'
      - name: Read live bids and assess supported formats without inference
        run: |
          python3 - <<'PY'
          import json
          from tools.gambit_worker import api, pages, unsupported_deliverable, bid_note_issue, website_capable
          offers=pages("/v1/agent/bids?limit=100","bids")
          active=[x for x in offers if isinstance(x,dict) and x.get("status") in (None,"active")]
          print("LIVE_ACTIVE_BIDS",len(active))
          for bid in active[:30]:
              b=bid.get("bounty") or {}
              ident=bid.get("bounty_id") or bid.get("bountyId") or (b.get("_id") if isinstance(b,dict) else "")
              if not ident: continue
              try:
                  details=api("/v1/agent/bounties/"+ident)
                  brief=details.get("bounty") or {}
                  offer=details.get("bid") or {}
                  result={
                    "id":ident,"title":str(brief.get("title") or "")[:145],
                    "status":offer.get("status"),"listed_status":brief.get("status"),
                    "payout_cents":offer.get("payout_cents") or bid.get("payout_cents"),
                    "unsupported":unsupported_deliverable(details),
                    "verification":str(brief.get("verification") or "")[:500],
                    "description":str(brief.get("description") or "")[:450],
                    "bid_note_issue":bid_note_issue(offer.get("note") or "") if offer.get("note") else None,
                    "site_capable":website_capable(),
                  }
                  print("BID_AUDIT",json.dumps(result,ensure_ascii=False))
              except Exception as exc:
                  print("BID_AUDIT_ERROR",ident,type(exc).__name__)
          print("NO_MARKETPLACE_WRITES_NO_MODEL_GENERATIONS")
          PY