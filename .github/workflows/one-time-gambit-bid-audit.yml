name: Private one-time Gambit bid audit
on:
  push:
    paths: ['.github/workflows/one-time-gambit-bid-audit.yml']
permissions:
  contents: read
jobs:
  read-bid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - name: Prepare crypto
        run: pip install --quiet cryptography
      - name: Read bounty and bid; encrypt entire response before writing logs
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, base64, zlib, secrets
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          pem = "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtBLjJNd00g3z+DU6+mM7\nXoXTiv4Ix6FURHahoHZnCXHWPsYbzr2grSC55rrXWFvLbx4WjnmiQ6DJTKLtekpo\nCy8bpqx3Xt9hs04KZT+QI7aDWPaNxvOgfSlOKbHFbjuPNIqlkdNPKdFXP94wktpv\n88YB7CEY4F6lMX8gEpTo1gyuDFeeQS1vuTgmWv1J8mmx41vpJwAmvw84l/H+Meit\nAreM4yfUdgL5vZEz4MQqu+rn245SBDyL1fbNh+ZE2j2vMibpypGBVDUkCI68pGxU\nfstqJTanPpMCMsXJpXwv8GXDj9JU3yeV2sjh0IymDqiPBwz5H713Z2kGEAmaU+Us\n9QIDAQAB\n-----END PUBLIC KEY-----"
          pub = serialization.load_pem_public_key(pem.encode())
          key = os.environ.get("BOUNTY_AGENT_API_KEY", "")
          ident = "mx76pb43azzzk2yndfwpqkcvjs8h7vz4"
          result = {"id": ident}
          if not key:
              result["error"] = "credential_not_set"
          else:
              routes = [("detail", "/v1/agent/bounties/"+ident),
                        ("bid", "/v1/agent/bounties/"+ident+"/bid"),
                        ("bids_list", "/v1/agent/bids?limit=100")]
              for label,route in routes:
                  try:
                      req=urllib.request.Request("https://api.trybounty.ai"+route,
                          headers={"Authorization":"Bearer "+key,
                                   "Accept":"application/json"})
                      with urllib.request.urlopen(req, timeout=22) as resp:
                          payload=json.loads(resp.read(300000))
                      if label=="bids_list":
                          rows=payload.get("bids", []) if isinstance(payload,dict) else payload
                          if not isinstance(rows,list): rows=[]
                          payload={"matches":[row for row in rows if ident in json.dumps(row)]}
                      result[label]=payload
                  except urllib.error.HTTPError as exc:
                      result[label]={"http_status":exc.code}
                  except Exception as exc:
                      result[label]={"error_type":type(exc).__name__}
          compressed=zlib.compress(json.dumps(result,ensure_ascii=False).encode(),9)
          sym=AESGCM.generate_key(bit_length=256)
          nonce=secrets.token_bytes(12)
          cipher=AESGCM(sym).encrypt(nonce,compressed,None)
          wrapped=pub.encrypt(sym,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          print("PRIVATE_GAMBIT_AUDIT="+base64.b64encode(wrapped+nonce+cipher).decode())
          PY
