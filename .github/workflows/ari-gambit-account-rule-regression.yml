name: ARI Gambit account-rule regression
on:
  push:
    branches: ['fix/gambit-account-research-recheck-20261101']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow \
            beautifulsoup4 jinja2
      - name: Compile and run regression suites
        run: |
          python3 -m py_compile tools/gambit_worker.py tools/gambit_early_scan.py \
            tests/test_gambit_worker.py tests/test_gambit_early_scan.py
          python3 -m unittest discover -s tests -p 'test_gambit_worker.py' -q
          python3 -m unittest discover -s tests -p 'test_gambit_early_scan.py' -q
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
