name: ARI commerce time-budget one-shot verification
on:
  push:
    branches:
      - ari-commerce-time-budget-20261111
jobs:
  budget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile amended Python modules
        run: python3 -m py_compile tools/open_web_discovery.py tools/autonomous_commerce_brain.py tests/test_commerce_run_budget.py
      - name: Run offline deadline regression
        run: python3 -m unittest discover -s tests -p 'test_commerce_run_budget.py' -v
