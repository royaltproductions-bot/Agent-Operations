name: Verify Wolverine and Cyclops firsthand-source fixes
on:
  push:
    branches:
      - feature/x-variants-firsthand-source-recovery
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install current variant test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow playwright
      - name: Compile changed runtime paths
        run: |
          python3 -m py_compile tools/autonomous_commerce_brain.py tools/cyclops_asset_engine.py tools/open_web_discovery.py
      - name: Run Wolverine and Cyclops regression suites
        run: |
          python3 -m unittest discover -s tests -p 'test_firsthand_source_recovery.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_commerce_portfolio.py' -q
      - name: Confirm Gambit unchanged by recovery patch
        run: |
          python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
