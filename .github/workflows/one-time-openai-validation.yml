name: One-time OpenAI Gambit Adapter Validation
on:
  push:
    paths: ['.github/workflows/one-time-openai-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Gambit runtime test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow
      - name: Python syntax validation
        run: python3 -m py_compile tools/gambit_openai.py tools/gambit_worker.py tools/gambit_watch.py tests/test_gambit_openai.py
      - name: OpenAI adapter and full Gambit regression tests
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
      - name: Check whether OpenAI is configured without disclosing credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_CONFIGURED=yes'
          else
            echo 'OPENAI_API_CONFIGURED=no'
          fi
