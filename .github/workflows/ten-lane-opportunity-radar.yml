name: Ten Lane Revenue Opportunity Radar
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/parallel_opportunity_radar.py'
      - 'tests/test_parallel_opportunity_radar.py'
      - 'tools/verify_opportunity_claims.py'
      - 'tests/test_verify_opportunity_claims.py'
      - 'tools/hn_contract_invitations.py'
      - 'tests/test_hn_contract_invitations.py'
      - '.github/workflows/ten-lane-opportunity-radar.yml'
permissions:
  contents: write
concurrency:
  group: ten-lane-revenue-radar
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate scanner
        run: |
          python3 -m py_compile tools/parallel_opportunity_radar.py
          python3 -m unittest discover -s tests -p 'test_parallel_opportunity_radar.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_opportunity_claims.py' -v
          python3 -m unittest discover -s tests -p 'test_hn_contract_invitations.py' -v
      - name: Scan ten independent public opportunity searches in parallel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/parallel_opportunity_radar.py --output ops/discovery/current.json
      - name: Verify competing PRs and issue claim status for discoveries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/verify_opportunity_claims.py --source ops/discovery/current.json --output ops/discovery/triage.json
      - name: Scan public direct contract invitations (read-only HN source)
        continue-on-error: true
        run: |
          python3 tools/hn_contract_invitations.py --output ops/discovery/hn-contract-invitations.json
      - name: Write truthful outcome summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('ops/discovery/current.json').read_text())
          triage = json.loads(Path('ops/discovery/triage.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Public market discovery, not paid customers\n\n')
              f.write('Configured lanes: **10**; completed lanes: **'
                      + str(data['successful_lanes']) + '**; unique candidates: **'
                      + str(data['unique_candidates']) + '**.\n\n')
              f.write('Candidates are NOT verified payouts, contacts, qualified buyer leads, or completed jobs.\n')
              hnpath = Path('ops/discovery/hn-contract-invitations.json')
              if hnpath.exists():
                  hn = json.loads(hnpath.read_text())
                  f.write('HN public contract invitation hints requiring review: '
                          + str(hn['potential_contract_mention_count'])
                          + ' in ' + str(hn['source_comment_count'])
                          + ' top-level comments. No verified payments.\n')
              else:
                  f.write('HN public contract source unavailable this run; no claims made.\n')
              f.write('Upstream duplicate/claim review: ' + str(triage['decision_counts']) + '.\n')
              for lane, problem in data['lane_errors'].items():
                  f.write('\n- ' + lane + ' search failed: ' + problem)
          PY
      - name: Commit deduplicated findings only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add ops/discovery/current.json ops/discovery/triage.json
          if test -f ops/discovery/hn-contract-invitations.json; then
            git add ops/discovery/hn-contract-invitations.json
          fi
          if git diff --cached --quiet; then
            echo 'No change in durable discovery state: no commit needed.'
          else
            git -c user.name=opportunity-radar -c user.email=ari-operations@agentmail.to \
              commit -m 'Refresh screened external cash opportunity hints (not confirmed leads)'
            # The branch may advance while search runs; never force-push.
            # Pull/rebase safely and try bounded non-destructive push retries.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Upstream changed before push (attempt $attempt); rebasing safely."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Concurrent edit conflict; next scheduled discovery will retry."
                exit 1
              fi
              sleep 2
            done
            if test "$pushed" != 1; then
              echo "Could not safely persist discovery after three attempts."
              exit 1
            fi
          fi
