name: One-time run Wolverine buyer-directed search
on:
  push:
    paths: ['.github/workflows/one-time-run-wolverine-buyer-hunt.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start updated Wolverine buyer search
        run: gh workflow run commerce-engine.yml --repo "$GITHUB_REPOSITORY" --ref main
