name: ARI afternoon offline regression (temporary)
on:
  push:
    branches:
      - ari-claude-20261102-afternoon-review
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies only
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 \
            beautifulsoup4 jinja2 playwright pillow
      - name: Syntax and isolated regressions
        run: |
          python3 -m py_compile tools/autonomous_commerce_brain.py tools/cyclops_asset_engine.py tests/test_x_variant_execution.py tests/test_gambit_worker.py
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
          python3 -m unittest discover -s tests -p 'test_gambit_worker.py' -q
