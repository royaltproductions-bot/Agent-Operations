name: Revenue Engine - Independent Reliability Monitor
on:
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/engine_health.py'
      - 'tests/test_engine_health.py'
      - 'ops/runs/*.json'
      - 'ops/scout-runs/*.json'
      - 'ops/agent-queue/*.json'
      - 'ops/outcomes/*.json'
      - '.github/workflows/revenue-engine-health.yml'
permissions:
  contents: read
concurrency:
  group: revenue-engine-health
  cancel-in-progress: false
jobs:
  independent-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate receipt classifier
        run: |
          python3 -m py_compile tools/engine_health.py
          python3 -m unittest discover -s tests -p 'test_engine_health.py' -v
      - name: Audit actual scheduled agent receipts (read-only)
        run: |
          python3 tools/engine_health.py > /tmp/health.json
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          data = json.loads(Path('/tmp/health.json').read_text())
          print(json.dumps(data, indent=2))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open('a', encoding='utf-8') as stream:
              stream.write("# Independent revenue engine reliability\n\n")
              stream.write("**Agent run evidence: " + data["reliability_status"] + "**\n\n")
              stream.write("| Independent evidence | Exact result |\n|---|---|\n")
              for role in ("scout", "executor"):
                  stream.write("| " + role + " terminal receipts in 24h | "
                               + str(data[role + "_terminal_records_last_24h"]) + " |\n")
                  stream.write("| " + role + " verified within 2h | "
                               + str(data[role + "_fresh_within_2h"]) + " |\n")
              stream.write("| Fresh GitHub discovery triage | " +
                           str(data["triage_fresh_within_3h"]) + " |\n")
              stream.write("| Qualified queue JSON | " +
                           str(data["qualified_queue_files"]) + " |\n")
              stream.write("| New revenue independently checked here | NO |\n\n")
              stream.write("This workflow measures log presence, NOT delivered outreach or revenue.\n\n")
              if data["issues"]:
                  stream.write("## Unresolved findings\n")
                  for issue in data["issues"]:
                      stream.write("- " + issue + "\n")
          if data["reliability_status"] != "PASS":
              print("::warning::Independent Scout/Executor run persistence is NOT VERIFIED. The workflow completed its audit; agent success is not implied.")
          PY

  scheduled-commerce:
    name: Verify real hourly commerce on the independent GitHub clock
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true
      - name: Test settlement and payment safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_commerce_operator.py' -v
      - name: Actual hourly Stripe + AgentMail commercial execution
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          COMMERCE_SEND_ENABLED: "YES"
          COMMERCE_REQUIRE_LIVE_READY: "YES"
          COMMERCE_STATUS_PATH: /tmp/commerce-live-status.json
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/commerce_operator.py
      - name: Persist genuine scheduled execution evidence and completed deliveries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/attest_scheduled_commerce.py
          git add ops/scheduled-commerce-attestations/*.json
          if compgen -G 'ops/commerce-deliveries/*.json' >/dev/null; then
            git add ops/commerce-deliveries/*.json
          fi
          if git diff --cached --quiet; then
            echo 'No new immutable scheduled receipt.'
            exit 0
          fi
          git -c user.name='commerce-automation' -c user.email='ari-operations@agentmail.to' \
            commit -m 'Record clock-triggered commerce result and privacy-safe fulfillment receipts'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1
