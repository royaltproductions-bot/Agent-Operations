name: One-time Gambit Sol and Monthly Budget Regression
on:
  push:
    paths: ['.github/workflows/one-time-sol-budget-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow
      - name: Validate syntax and all Gambit tests without API secrets
        run: |
          python3 -m py_compile tools/gambit_openai.py tools/gambit_watch.py tools/gambit_worker.py tests/test_gambit_openai.py
          python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
      - name: Ensure marketplace scans don't depend on OpenAI credentials
        run: |
          python3 - <<'PY'
          import os
          os.environ.pop("OPENAI_API_KEY", None)
          os.environ["GAMBIT_INFERENCE_PROVIDER"] = "auto"
          from tools.gambit_openai import provider
          assert provider() == "ollama"
          print("No OpenAI calls without configured key")
          PY
