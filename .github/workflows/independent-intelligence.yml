name: Independent On-Runner Intelligence - Commerce
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/independent-intelligence.yml'
      - 'tools/external_market_agent.py'
      - 'tests/test_external_market_agent.py'
      - 'tools/autonomous_commerce_brain.py'
      - 'tests/test_autonomous_commerce_brain.py'
      - 'tools/connected_commerce_tools.py'
      - 'tests/test_connected_commerce_tools.py'
      - 'tools/render_deploy_bridge.py'
      - 'tests/test_render_deploy_bridge.py'
      - 'tests/test_model_recovery.py'
      - 'tools/commerce_portfolio.py'
      - 'tools/commercial_outcomes.py'
      - 'tests/test_commerce_portfolio.py'
      - 'tests/test_commercial_outcomes.py'
      - 'tests/test_broader_market_sources.py'
      - 'tools/sales_conversation.py'
      - 'tests/test_sales_conversation.py'
      - 'tools/render_direct_api.py'
      - 'tests/test_render_direct_api.py'
      - 'storefront/**'
  pull_request:
    paths:
      - '.github/workflows/independent-intelligence.yml'
      - 'tools/external_market_agent.py'
      - 'tests/test_external_market_agent.py'
      - 'tools/autonomous_commerce_brain.py'
      - 'tests/test_autonomous_commerce_brain.py'
      - 'tools/connected_commerce_tools.py'
      - 'tests/test_connected_commerce_tools.py'
      - 'tools/render_deploy_bridge.py'
      - 'tests/test_render_deploy_bridge.py'
      - 'tests/test_model_recovery.py'
      - 'tools/commerce_portfolio.py'
      - 'tools/commercial_outcomes.py'
      - 'tests/test_commerce_portfolio.py'
      - 'tests/test_commercial_outcomes.py'
      - 'tests/test_broader_market_sources.py'
      - 'tools/sales_conversation.py'
      - 'tests/test_sales_conversation.py'
      - 'tools/render_direct_api.py'
      - 'tests/test_render_direct_api.py'
      - 'storefront/**'
permissions:
  contents: write
concurrency:
  group: independent-on-runner-intelligence
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test tool guards and model response handling
        run: |
          python3 -m py_compile tools/external_market_agent.py tools/autonomous_commerce_brain.py tools/connected_commerce_tools.py tools/render_deploy_bridge.py tools/render_direct_api.py tools/commerce_portfolio.py tools/commercial_outcomes.py tools/sales_conversation.py
          python3 -m unittest discover -s tests -p 'test_external_market_agent.py' -v
          python3 -m unittest discover -s tests -p 'test_autonomous_commerce_brain.py' -v
          python3 -m unittest discover -s tests -p 'test_connected_commerce_tools.py' -v
          python3 -m unittest discover -s tests -p 'test_render_deploy_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_render_direct_api.py' -v
          python3 -m unittest discover -s tests -p 'test_model_recovery.py' -v
          python3 -m unittest discover -s tests -p 'test_commerce_portfolio.py' -v
          python3 -m unittest discover -s tests -p 'test_commercial_outcomes.py' -v
          python3 -m unittest discover -s tests -p 'test_broader_market_sources.py' -v
          python3 -m unittest discover -s tests -p 'test_sales_conversation.py' -v

  autonomous-operation:
    if: github.event_name != 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      LOCAL_MODEL: qwen3:4b-instruct-2507-q4_K_M
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      COMMERCE_SEND_ENABLED: 'YES'
      AGENTMAIL_AGENT_REPLIES_ENABLED: 'YES'
      ENTERPRISE_OUTREACH_ENABLED: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify direct Render API authentication and deployment status
        run: python3 -m tools.render_direct_api --check
      - name: Restore local open-weight model cache
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: ollama-openweight-qwen3-4b-instruct-2507-q4-v1
      - name: Install model runtime locally, no sign-in or paid inference API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama-runner.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$LOCAL_MODEL"
          ollama list
      - name: Let independent model select and execute actual tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.autonomous_commerce_brain
          test -s "ops/enterprise-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Persist model-originated tool receipts and owned-site output
        shell: bash
        run: |
          set -euo pipefail
          git add ops/enterprise-runs/
          if test -d ops/render-deploy-requests; then git add ops/render-deploy-requests/; fi
          if git diff --cached --quiet; then
            echo 'No new authorized intelligence output.'
            exit 0
          fi
          git config user.name 'independent-commerce-model'
          git config user.email 'ari-operations@agentmail.to'
          git commit -m 'Record independently executed model decisions and customer-facing actions'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1
      - name: Independently publish committed storefront revision if needed
        if: success()
        run: python3 -m tools.render_direct_api --deploy
