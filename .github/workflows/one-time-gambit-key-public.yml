name: One-time Gambit encryption recipient public key
on:
  push:
    paths: ['.github/workflows/one-time-gambit-key-public.yml']
permissions:
  contents: read
jobs:
  recipient:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - name: Install cryptography
        run: python3 -m pip install --quiet cryptography
      - name: Emit public encryption key only
        run: |
          python3 - <<'PY'
          import hashlib, os
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          secret=os.environ.get("BOUNTY_AGENT_API_KEY","")
          if not secret:
              raise SystemExit("MISSING_AGENT_CREDENTIAL")
          seed=hashlib.sha256(b"gambit-openaikey-bridge-v1:"+secret.encode()).digest()
          pk=X25519PrivateKey.from_private_bytes(seed).public_key()
          print("GAMBIT_ENCRYPTION_PUBLIC_KEY="+pk.public_bytes(Encoding.Raw,PublicFormat.Raw).hex())
          print("The secret itself was not logged or transmitted.")
          PY
