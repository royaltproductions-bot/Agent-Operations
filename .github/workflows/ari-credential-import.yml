name: ARI approved credential import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ari-credential-import.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Prepare encrypted import key
        env:
          BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,json,base64,hashlib
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from tools.persist_run_receipt import persist
          secret=os.environ['BOUNTY_AGENT_API_KEY']
          assert secret
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          private=key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())
          cipher=Fernet(base64.urlsafe_b64encode(hashlib.sha256(b'ari-import-v1:'+secret.encode()).digest()))
          data={'public_key':key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode(),'private_encrypted':cipher.encrypt(private).decode(),'run_id':os.environ['GITHUB_RUN_ID']}
          path='ops/ari-import-key-20261111.json'
          Path(path).write_text(json.dumps(data)+'\n')
          persist(path,'Prepare sealed import for approved BountyBoard credential')
          print('Import public key ready; private key remains encrypted under runner secret')
          PYCODE
