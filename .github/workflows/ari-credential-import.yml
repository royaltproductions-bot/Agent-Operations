name: ARI approved credential import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ari-credential-import.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cryptography
      - name: Connect and verify approved BountyBoard credential
        env:
          BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,json,base64,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from tools.persist_run_receipt import persist
          from tools import gambit_credentials,gambit_secondary_marketplace
          root=os.environ['BOUNTY_AGENT_API_KEY']
          transport=json.loads(Path('ops/ari-import-key-20261111.json').read_text())
          incoming=json.loads(Path('ops/ari-bountyboard-import-20261111.json').read_text())
          assert incoming['agent_id']==gambit_credentials.AGENT_ID
          wrapper=Fernet(base64.urlsafe_b64encode(hashlib.sha256(b'ari-import-v1:'+root.encode()).digest()))
          private=serialization.load_pem_private_key(wrapper.decrypt(transport['private_encrypted'].encode()),password=None)
          key=private.decrypt(base64.b64decode(incoming['ciphertext']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=b'ari-bountyboard-v1'))
          assert key.startswith(b'bb_ag_')
          path=gambit_credentials.CREDENTIAL_PATH
          path.write_text(json.dumps({'version':1,'agent_id':gambit_credentials.AGENT_ID,'encrypted_key':gambit_credentials.cipher(root).encrypt(key).decode()})+'\n')
          state={};result=gambit_secondary_marketplace.observe(state)
          assert result['status']=='observed_authenticated', result['status']
          persist(str(path),'Connect encrypted BountyBoard credential')
          receipt={'at':datetime.now(timezone.utc).isoformat(),'run_id':os.environ['GITHUB_RUN_ID'],'sha':os.environ['GITHUB_SHA'],'result':result,'model_calls':0,'paid_cost_added':0}
          receipt_path='ops/bountyboard-connection-20261111.json'
          Path(receipt_path).write_text(json.dumps(receipt,indent=2)+'\n')
          persist(receipt_path,'Record authenticated BountyBoard connection')
          print('BountyBoard authenticated; encrypted credential persisted; zero model calls')
          PYCODE
