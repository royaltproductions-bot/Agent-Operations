name: Cyclops Reusable Assets
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/cyclops_asset_engine.py'
      - 'tools/cyclops_workshop.py'
      - 'tools/cyclops-workshop.Dockerfile'
      - 'tools/cyclops_vault.py'
      - 'tools/connected_commerce_tools.py'
      - 'tools/research_memory.py'
      - 'tools/open_web_discovery.py'
      - '.github/workflows/cyclops-assets.yml'

permissions:
  contents: write

concurrency:
  group: cyclops-reusable-assets
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CYCLOPS_MODEL: qwen3:8b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      COMMERCE_SEND_ENABLED: 'YES'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true

      - name: Validate production Python syntax
        run: python3 -m py_compile tools/cyclops_asset_engine.py tools/cyclops_workshop.py tools/cyclops_vault.py tools/connected_commerce_tools.py tools/open_web_discovery.py tools/research_memory.py

      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .ollama-cache/models
          key: ollama-commerce-qwen3-8b-v1

      - name: Check live Cyclops execution before loading Qwen
        id: preflight
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q

      - name: Prepare isolated production tools
        shell: bash
        run: |
          set -euo pipefail
          docker build -q -t cyclops-workshop:local -f tools/cyclops-workshop.Dockerfile tools

      - name: Start Cyclops model
        id: model
        shell: bash
        run: |
          set +e
          ready=false
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          # GitHub owns the execution deadline; no internal startup timeout.
          until curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; do
            sleep 1
          done
          ready=true
          if [ "$ready" = true ]; then
            if ollama show "$CYCLOPS_MODEL" >/dev/null 2>&1; then
              echo "Using existing cached $CYCLOPS_MODEL model"
            else
              ready=false
              for attempt in 1 2 3; do
                if ollama pull "$CYCLOPS_MODEL"; then
                  ready=true
                  break
                fi
                echo "Model registry unavailable; retry $attempt/3"
                sleep $((attempt * 5))
              done
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Cyclops
        id: cyclops
        if: steps.model.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          python3 -m tools.cyclops_asset_engine
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist Cyclops receipt
        if: always()
        shell: bash
        env:
          MODEL_READY: ${{ steps.model.outputs.ready }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CYCLOPS_OUTCOME: ${{ steps.cyclops.outcome }}
        run: |
          set -euo pipefail
          receipt="ops/cyclops-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if [ ! -s "$receipt" ]; then
            mkdir -p ops/cyclops-runs
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          reason="cyclops_process_failure"
          if os.environ.get("PREFLIGHT_OUTCOME")!="success":
              reason="production_preflight_failure"
          elif os.environ.get("MODEL_READY")!="true":
              reason="model_startup_failure"
          elif os.environ.get("CYCLOPS_OUTCOME")=="skipped":
              reason="cyclops_step_skipped"
          path=f"ops/cyclops-runs/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          data={
            "schema_version":1,
            "lane":"cyclops_reusable_assets",
            "timestamp":datetime.now(timezone.utc).isoformat(),
            "structural_failures":[{"reason":reason}],
            "economic_result":{
              "new_asset_created":0,
              "new_product_offers_sent":0,
              "fulfilled_orders_seen":0,
              "verified_cyclops_revenue_cents_seen":0
            }
          }
          with open(path,"w") as f:
              json.dump(data,f,indent=2); f.write("\n")
          PY
          fi
          encoded="$(base64 -w0 "$receipt")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$receipt" \
            -f message='Record Cyclops economic outcome' \
            -f content="$encoded" \
            -f branch='main' >/dev/null

      - name: Surface actual engine exit status
        if: always()
        shell: bash
        env:
          MODEL_READY: ${{ steps.model.outputs.ready }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.cyclops.outputs.exit_code }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::error::Cyclops offline preflight failed"
            exit 1
          fi
          if [ "$MODEL_READY" != "true" ]; then
            echo "::error::Cyclops model failed to start"
            exit 1
          fi
          if [ "${ENGINE_EXIT_CODE:-}" != "0" ]; then
            echo "::error::Cyclops ended with operational error code ${ENGINE_EXIT_CODE:-missing}"
            exit 1
          fi
