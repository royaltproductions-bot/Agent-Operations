name: Agent Queue - Validation and Unit Tests
on:
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/agent_queue.py'
      - 'tests/test_agent_queue.py'
      - 'ops/agent-queue/*.json'
      - '.github/workflows/agent-queue-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-queue-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline state-machine tests
        run: |
          python3 -m py_compile tools/agent_queue.py
          python3 -m unittest discover -s tests -p 'test_agent_queue.py' -v
      - name: Validate current qualified opportunity queue
        run: python3 tools/agent_queue.py --mode validate
      - name: Show ranked eligible handoffs
        run: python3 tools/agent_queue.py --mode rank
      - name: Detect stuck agent claims without re-executing them
        run: |
          python3 tools/agent_queue.py --mode health | tee /tmp/agent-health.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path('/tmp/agent-health.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Multi-agent opportunity pipeline health\n')
              for k in ('qualified', 'claimed', 'completed', 'blocked'):
                  stream.write(f'- {k}: {state[k]}\n')
              if state['expired_claim_ids']:
                  stream.write('- Attention: expired claims need safe remote reconciliation (NOT automatic replay): ' +
                               ', '.join(state['expired_claim_ids']) + '\n')
              else:
                  stream.write('- No expired claimed work detected\n')
          PY
