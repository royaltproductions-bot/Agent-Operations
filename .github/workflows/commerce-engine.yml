name: Commerce Engine
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-revenue-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMMERCE_MODEL: qwen3:8b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      COMMERCE_SEND_ENABLED: 'YES'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5
          persist-credentials: true

      - name: Check live-market execution before loading Qwen
        id: preflight
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography pypdf
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q

      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .ollama-cache/models
          key: ollama-commerce-qwen3-8b-v1

      - name: Start commerce model
        id: model
        shell: bash
        run: |
          set +e
          ready=false
          curl -fsSL https://ollama.com/install.sh | sh &&
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          # GitHub owns the execution deadline; no internal startup timeout.
          until curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; do
            sleep 1
          done
          ready=true
          if [ "$ready" = true ]; then
            if ollama show "$COMMERCE_MODEL" >/dev/null 2>&1; then
              echo "Using existing cached $COMMERCE_MODEL model"
            else
              ready=false
              for attempt in 1 2 3; do
                if ollama pull "$COMMERCE_MODEL"; then
                  ready=true
                  break
                fi
                echo "Model registry unavailable; retry $attempt/3"
                sleep $((attempt * 5))
              done
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run commercial experiment
        id: commerce
        if: steps.model.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          python3 -m tools.autonomous_commerce_brain
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist experiment receipt
        if: always()
        shell: bash
        env:
          MODEL_READY: ${{ steps.model.outputs.ready }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          COMMERCE_OUTCOME: ${{ steps.commerce.outcome }}
          COMMERCE_EXIT_CODE: ${{ steps.commerce.outputs.exit_code }}
        run: |
          set -euo pipefail
          receipt="ops/enterprise-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if [ ! -s "$receipt" ]; then
            mkdir -p ops/enterprise-runs
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          reason="engine_process_failure"
          if os.environ.get("PREFLIGHT_OUTCOME")!="success":
              reason="production_preflight_failure"
          elif os.environ.get("MODEL_READY")!="true":
              reason="model_startup_failure"
          elif os.environ.get("COMMERCE_OUTCOME")=="skipped":
              reason="commerce_step_skipped"
          path=f"ops/enterprise-runs/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          data={
            "schema_version":2,
            "engine":"autonomous_revenue_engine",
            "timestamp":datetime.now(timezone.utc).isoformat(),
            "model":os.environ.get("COMMERCE_MODEL","unknown"),
            "fulfillment":[],
            "discovery":{},
            "offer":None,
            "external_action":None,
            "structural_failures":[{"reason":reason}],
            "commercial_outcomes":[],
            "economic_result":{
              "new_offers_sent":0,
              "fulfilled_orders_seen":0,
              "verified_autonomous_revenue_cents_seen":0
            }
          }
          with open(path,"w") as f:
              json.dump(data,f,indent=2); f.write("\n")
          PY
          fi
          python3 -m tools.persist_run_receipt "$receipt" "Record commerce experiment outcome"

      - name: Surface actual engine exit status
        if: always()
        shell: bash
        env:
          MODEL_READY: ${{ steps.model.outputs.ready }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.commerce.outputs.exit_code }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::error::Commerce Engine offline preflight failed"
            exit 1
          fi
          if [ "$MODEL_READY" != "true" ]; then
            echo "::error::Commerce Engine model failed to start"
            exit 1
          fi
          if [ "${ENGINE_EXIT_CODE:-}" != "0" ]; then
            echo "::error::Commerce Engine ended with operational error code ${ENGINE_EXIT_CODE:-missing}"
            exit 1
          fi
