name: Commerce Engine
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/autonomous_commerce_brain.py'
      - 'tools/connected_commerce_tools.py'
      - '.github/workflows/commerce-engine.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-revenue-production
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMMERCE_MODEL: qwen3:8b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      COMMERCE_SEND_ENABLED: 'YES'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: true

      - uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: ollama-commerce-qwen3-8b-v1

      - name: Start commerce model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull "$COMMERCE_MODEL"

      - name: Run commercial experiment
        id: commerce
        shell: bash
        run: |
          set +e
          python3 -m tools.autonomous_commerce_brain
          code=$?
          receipt="ops/enterprise-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if [ ! -s "$receipt" ]; then
            mkdir -p ops/enterprise-runs
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path=f"ops/enterprise-runs/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}.json"
          data={
            "schema_version":2,
            "engine":"autonomous_revenue_engine",
            "timestamp":datetime.now(timezone.utc).isoformat(),
            "model":os.environ.get("COMMERCE_MODEL","unknown"),
            "fulfillment":[],
            "discovery":{},
            "offer":None,
            "external_action":None,
            "structural_failures":[{"reason":"engine_process_failure"}],
            "commercial_outcomes":[],
            "economic_result":{
              "new_offers_sent":0,
              "fulfilled_orders_seen":0,
              "verified_autonomous_revenue_cents_seen":0
            }
          }
          with open(path,"w") as f:
              json.dump(data,f,indent=2); f.write("\n")
          PY
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist experiment receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="ops/enterprise-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          test -s "$receipt"
          encoded="$(base64 -w0 "$receipt")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$receipt" \
            -f message='Record commerce experiment outcome' \
            -f content="$encoded" \
            -f branch='main' >/dev/null

      - name: Send structural failure to refiner
        if: steps.commerce.outputs.exit_code != '0'
        shell: bash
        run: gh workflow run commerce-refiner.yml --ref main --repo "$GITHUB_REPOSITORY"
