name: Verify Gambit iterative fulfillment and web QA
on:
  push:
    paths: ['.github/workflows/one-time-verify-gambit-retries.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow playwright
      - name: Validate Python and full Gambit tests
        env:
          GAMBIT_INFERENCE_PROVIDER: ollama
        run: |
          python3 -m compileall -q tools
          python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
      - name: Verify multi-page and browser-device test coverage exists
        run: |
          python3 - <<'PY'
          from tools.gambit_visual_qa import VIEWPORTS
          from pathlib import Path
          sites=Path('tests/test_gambit_site_resources.py').read_text()
          assert VIEWPORTS['desktop']==(1440,900)
          assert VIEWPORTS['mobile']==(390,844)
          assert 'test_complete_multipage_site_links_and_packages_all_pages' in sites
          assert 'test_worker_generates_multiple_linked_pages_without_website_vendor' in sites
          assert 'render_browser_evidence' in Path('tools/gambit_worker.py').read_text() or 'site_visual' in Path('tools/gambit_worker.py').read_text()
          print('Multipage source and desktop/mobile browser QA are present')
          PY