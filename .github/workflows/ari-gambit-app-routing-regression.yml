name: ARI Gambit application-routing regression
on:
  push:
    branches: ['fix/gambit-functional-app-recognition-20261101']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install existing offline test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 pillow \
            beautifulsoup4 jinja2 playwright
      - name: Verify existing isolated app sandbox and mobile/desktop browser
        env:
          GAMBIT_APP_TEST_DIAGNOSTICS: '1'
        run: |
          python3 -m tools.gambit_app_smoke
      - name: Compile and run app/worker/compatibility tests
        run: |
          python3 -m py_compile tools/gambit_app_builder.py tools/gambit_worker.py \
            tests/test_gambit_app_builder.py tests/test_gambit_worker.py
          python3 -m unittest discover -s tests -p 'test_gambit_app_builder.py' -q
          python3 -m unittest discover -s tests -p 'test_gambit_worker.py' -q
          python3 -m unittest discover -s tests -p 'test_x_variant_execution.py' -q
          python3 -m unittest discover -s tests -p 'test_variant_optimization.py' -q
