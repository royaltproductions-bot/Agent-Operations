name: Cancel Stale Gambit Run 569

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-gambit-run-569.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pre-H3 resident run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/43104013673/cancel
