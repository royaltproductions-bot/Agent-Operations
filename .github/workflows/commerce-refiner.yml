name: Commerce Refiner
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commerce-refiner.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: commerce-refiner
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFINER_MODEL: qwen2.5-coder:7b-instruct
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: true

      - uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: ollama-refiner-qwen2-5-coder-7b-instruct-v1

      - name: Start refiner model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull "$REFINER_MODEL"

      - name: Refine from commercial evidence
        id: refine
        run: python3 tools/continuous_commerce_refiner.py

      - name: Deploy refinement
        if: steps.refine.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add tools/autonomous_commerce_brain.py tools/connected_commerce_tools.py ops/refiner-runs/
          git -c user.name='commerce-refiner' -c user.email='ari-operations@agentmail.to'             commit -m 'Refine commerce engine from market evidence'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              gh workflow run commerce-engine.yml --ref main --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          exit 1
