name: VendorSettle - Automated Opt-In Inquiry Response
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: inbound-vendorsettle-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  answer:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate inquiry responder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_commerce_inbound_issue.py' -v
      - name: Prepare response only for opted-in vendor inquiry
        run: python3 tools/commerce_inbound_issue.py
      - name: Reply to inquiry once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          if test ! -s /tmp/commerce-issue-reply.md; then
            echo 'Not a qualifying buyer inquiry; no outbound action.'
            exit 0
          fi
          # Check existing bot replies before writing. Do not echo issue text.
          gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" > /tmp/inquiry-comments.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          comments=json.loads(Path('/tmp/inquiry-comments.json').read_text())
          marker='<!-- automated-vendorsettle-inquiry-response-v1 -->'
          count=sum(marker in (x.get('body') or '') for x in comments)
          if count:
              Path('/tmp/commerce-issue-reply.md').unlink(missing_ok=True)
              print('Prior responder receipt exists: skip duplicate')
          PY
          if test -s /tmp/commerce-issue-reply.md; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file /tmp/commerce-issue-reply.md
            echo 'Public response submitted to a real inbound issue.'
          fi
