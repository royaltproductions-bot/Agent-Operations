name: Audit live buyer responses for remaining Gambit bids
on:
  push:
    paths: ['.github/workflows/one-time-active-bid-response-audit.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --disable-pip-version-check 'cryptography>=43,<48' 'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' 'reportlab>=4,<5'
      - name: Inspect active bid messages without publishing buyer text
        run: |
          python3 - <<'PY'
          import json
          from tools.gambit_worker import api, pages, messages_for, unsupported_deliverable
          for bid in pages('/v1/agent/bids?limit=100','bids'):
              if not isinstance(bid,dict) or bid.get('status') not in ('active',None):
                  continue
              b=bid.get('bounty') or {}
              ident=bid.get('bounty_id') or bid.get('bountyId') or (b.get('_id') if isinstance(b,dict) else '')
              if not ident:
                  continue
              try:
                  d=api('/v1/agent/bounties/'+ident)
                  messages=messages_for(ident)
                  from_buyer=[m for m in messages if m.get('author_type')=='user']
                  last=messages[-1] if messages else {}
                  print('ACTIVE_BID',json.dumps({
                      'id':ident,
                      'title':str((d.get('bounty') or {}).get('title') or '')[:85],
                      'unsupported':unsupported_deliverable(d),
                      'message_count':len(messages),
                      'buyer_message_count':len(from_buyer),
                      'last_author_type':last.get('author_type'),
                      'last_message_at':str(last.get('created_at') or '')[:40],
                      'buyer_waiting':bool(messages and last.get('author_type')=='user')
                  }))
              except Exception as exc:
                  print('BID_AUDIT_ERROR',ident,type(exc).__name__)
          PY