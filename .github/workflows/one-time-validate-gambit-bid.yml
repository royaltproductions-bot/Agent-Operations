name: One-time Gambit Bid Quality Regression
on:
  push:
    paths: ['.github/workflows/one-time-validate-gambit-bid.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install required libraries
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' 'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow
      - name: Run Gambit worker unit tests
        run: python3 -m unittest discover -s tests -p test_gambit_worker.py -q
      - name: Validate full Gambit test suite
        run: python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
