name: One-time Sol-only Gambit Budget Final Check
on:
  push:
    paths: ['.github/workflows/one-time-sol-final-check.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            'pypdf>=5,<8' 'python-docx>=1.2,<2' 'openpyxl>=3.1,<4' \
            'reportlab>=4,<5' 'cryptography>=43,<48' ddgs==9.16.1 playwright pillow
      - name: Compile changed modules and run Gambit regressions
        run: |
          python3 -m py_compile tools/gambit_openai.py tools/gambit_worker.py tools/gambit_watch.py
          python3 -m unittest discover -s tests -p 'test_gambit_*.py' -q
