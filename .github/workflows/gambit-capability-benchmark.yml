name: Gambit Real Capability Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gambit-capability-benchmark.yml'
      - 'tools/gambit_benchmark.py'
      - 'tools/gambit_worker.py'
      - 'tools/gambit_analytics.py'
      - 'tools/gambit_documents.py'
      - 'tools/gambit_sites.py'
      - 'tools/gambit_visual_qa.py'
      - 'tests/test_gambit_visual_qa.py'
      - 'tools/gambit_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-work:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GAMBIT_MODEL: qwen3:8b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-cache/models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4

      - name: Install browser rendering and visual-check dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet 'playwright>=1.51,<2' 'pillow>=10,<13'

      - name: Verify desktop/mobile Chrome rendering
        run: python3 -m unittest discover -s tests -p 'test_gambit_visual_qa.py' -v

      - name: Restore the same open-source model as the paid worker
        uses: actions/cache@v4
        with:
          path: .ollama-cache/models
          key: gambit-qwen3-8b-v1

      - name: Start Gambit's production model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/gambit-benchmark-ollama.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ollama show "$GAMBIT_MODEL" >/dev/null 2>&1 || ollama pull "$GAMBIT_MODEL"

      - name: Actually generate and score three commercial work samples
        env:
          GAMBIT_BENCHMARK_PREVIEW_DIR: ${{ runner.temp }}/gambit-website-previews
        run: python3 -m tools.gambit_benchmark

      - name: Upload experimental website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gambit-desktop-mobile-previews
          path: ${{ runner.temp }}/gambit-website-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
