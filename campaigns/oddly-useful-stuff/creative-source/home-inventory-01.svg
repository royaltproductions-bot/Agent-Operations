<text x="168" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#e8ffe7" letter-spacing="3">ODDLY USEFUL STUFF</text>
<text x="66" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" fill="#7ff6a6" letter-spacing="3">A QUESTION FOR FUTURE YOU</text>
<text x="65" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="79" font-weight="800" fill="#fffef2">COULD YOU LIST</text>
<text x="65" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="78" font-weight="800" fill="#fffef2">EVERYTHING</text>
<text x="65" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#accent)">YOU OWN?</text>
<rect x="65" y="622" width="950" height="120" rx="20" fill="#102f24" stroke="#357f61" stroke-width="2"/>
<text x="98" y="674" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" fill="#e5f4e7">Try this quick home-inventory starter.</text>
<text x="98" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#99d8ae">No special app. Just your phone.</text>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="65" y="791" width="950" height="195" rx="20" fill="#10251c" stroke="#2d7756" stroke-width="2"/>
<rect x="94" y="828" width="94" height="94" rx="18" fill="#a7f985"/><text x="141" y="895" text-anchor="middle" font-size="56" font-weight="800" fill="#07160c">1</text>
<text x="219" y="857" font-size="45" font-weight="700" fill="#fffdf3">FILM ONE ROOM</text><text x="219" y="917" font-size="34" fill="#c9e2d0">Open drawers, closets &amp; cabinets.</text>
