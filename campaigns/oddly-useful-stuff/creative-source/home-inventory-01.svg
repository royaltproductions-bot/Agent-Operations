<rect x="94" y="1041" width="94" height="94" rx="18" fill="#a7f985"/><text x="141" y="1108" text-anchor="middle" font-size="56" font-weight="800" fill="#07160c">2</text>
<text x="219" y="1070" font-size="45" font-weight="700" fill="#fffdf3">ZOOM IN ON DETAILS</text><text x="219" y="1130" font-size="33" fill="#c9e2d0">Brands, models, serial numbers.</text>
<rect x="65" y="1217" width="950" height="195" rx="20" fill="#10251c" stroke="#2d7756" stroke-width="2"/>
<rect x="94" y="1254" width="94" height="94" rx="18" fill="#a7f985"/><text x="141" y="1321" text-anchor="middle" font-size="56" font-weight="800" fill="#07160c">3</text>
<text x="219" y="1283" font-size="45" font-weight="700" fill="#fffdf3">BACK IT UP</text><text x="219" y="1343" font-size="33" fill="#c9e2d0">Keep a copy outside your home.</text>
<rect x="65" y="1430" width="950" height="195" rx="20" fill="#10251c" stroke="#2d7756" stroke-width="2"/>
<rect x="94" y="1467" width="94" height="94" rx="18" fill="#a7f985"/><text x="141" y="1534" text-anchor="middle" font-size="56" font-weight="800" fill="#07160c">4</text>
<text x="219" y="1496" font-size="45" font-weight="700" fill="#fffdf3">UPDATE IT YEARLY</text><text x="219" y="1556" font-size="33" fill="#c9e2d0">And after important new purchases.</text>
